DIF.views.fonteItem = (f, { did, extra = '' } = {}) => {
  const I = DIF.icon, ui = DIF.ui, t = DIF.sourceTypes[f.tipo], esc = DIF.util.esc;
  const usadas = DIF.store.state.descobertas.filter(d => d.fontes.includes(f.id)).length;
  return `<div class="src">${ui.fonteIcone(f.tipo, t.classe === 'funcional' ? 'red' : '')}
    <div class="meta"><b>${esc(f.nome)}</b><small>${t.nome} · ${esc(f.detalhe || '')}</small>${extra}</div>
    <div class="badges">${ui.classeBadge(t.classe)}${ui.badge(`<span class="tnum">${DIF.util.n(f.preview)}</span>&nbsp;${t.rotulo}`, 'b-neutral b-sm')}</div>
    <div style="width:150px;text-align:right">${ui.fonteStatus(f)}<div class="muted" style="font-size:11.5px">${esc(f.versao || '')}</div></div>
    <div style="display:flex;gap:2px">
      <button class="icon-btn" data-action="testar-fonte" data-id="${f.id}" data-tip="Testar conexão" aria-label="Testar conexão">${I('refresh', 16)}</button>
      ${did ? `<button class="icon-btn no" data-action="remover-fonte" data-did="${did}" data-id="${f.id}" data-tip="Remover desta descoberta" aria-label="Remover">${I('trash', 16)}</button>`
        : `<button class="icon-btn no" data-action="excluir-fonte" data-id="${f.id}" data-tip="${usadas ? `Em uso em ${usadas} descoberta(s)` : 'Excluir da biblioteca'}" aria-label="Excluir" ${usadas ? 'disabled' : ''}>${I('trash', 16)}</button>`}
    </div></div>`;
};

DIF.views.etapaFontes = d => {
  const S = DIF.store, I = DIF.icon, ui = DIF.ui, esc = DIF.util.esc;
  const fontes = d.fontes.map(id => S.fonte(id)).filter(Boolean);
  const tec = fontes.filter(f => DIF.sourceTypes[f.tipo].classe === 'tecnica').length, fun = fontes.length - tec;
  const bib = S.state.fontes.filter(f => !d.fontes.includes(f.id));
  const tipos = Object.entries(DIF.sourceTypes).map(([k, t]) => `<button class="stype" data-action="abrir-tipo-fonte" data-tipo="${k}" data-did="${d.id}">
      <span class="plus">${I('plus', 18)}</span><div class="ico-box">${I(t.icon, 20)}</div><div><b>${t.nome}</b><br><small>${t.desc}</small></div>
      <div>${ui.classeBadge(t.classe)}</div></button>`).join('');
  const lista = fontes.length ? fontes.map(f => DIF.views.fonteItem(f, { did: d.id })).join('')
    : `<div class="card">${ui.empty({ icon: 'layers', titulo: 'Nenhuma fonte ainda', texto: 'Adicione repositórios, bancos, contratos de API, servidores MCP, documentos ou imagens. Você pode reaproveitar fontes da biblioteca.' })}</div>`;
  const chk = (ok, t) => `<div class="check-i ${ok ? 'ok' : ''}"><span class="c">${ok ? I('check', 12) : ''}</span><span>${t}</span></div>`;
  return `${ui.pageHeader({ n: 1, eyebrow: 'Etapa 1 · Fontes', titulo: 'De onde vamos <em>descobrir as regras</em>?',
      sub: 'Combine fontes técnicas e funcionais. É o cruzamento entre elas que revela conflitos entre o que o código faz e o que o normativo determina.' })}
    <div class="split"><div>
      <div class="sec-t"><h2>Fontes desta descoberta</h2><span class="sub">${fontes.length} conectada(s)</span></div>${lista}
      <div class="sec-t"><h2>Adicionar nova fonte</h2><span class="sub">Cada tipo tem seu próprio formulário</span></div>
      <div class="grid g4">${tipos}</div>
    </div><aside style="display:flex;flex-direction:column;gap:16px;position:sticky;top:170px">
      <div class="card"><div class="card-h"><h3>Equilíbrio das fontes</h3></div><div class="card-b balance">
        <div class="row"><span style="width:76px">Técnicas</span><div class="prog"><span style="width:${DIF.util.pct(tec, Math.max(fontes.length, 1))}%;background:var(--tech)"></span></div><b class="tnum">${tec}</b></div>
        <div class="row"><span style="width:76px">Funcionais</span><div class="prog"><span style="width:${DIF.util.pct(fun, Math.max(fontes.length, 1))}%"></span></div><b class="tnum">${fun}</b></div>
        <div style="margin-top:4px">${chk(fontes.length > 0, 'Ao menos uma fonte conectada')}${chk(tec > 0, 'Fonte técnica (código, banco, API ou MCP)')}${chk(fun > 0, 'Fonte funcional (normativo, história, imagem)')}</div>
      </div></div>
      <div class="card"><div class="card-h"><h3>Da biblioteca</h3><span class="r muted" style="font-size:12px">${bib.length} disponível(is)</span></div><div class="card-b" style="padding-top:8px;padding-bottom:8px">
        ${bib.length ? bib.map(f => `<div class="lib-i"><div class="ico-box sm">${I(DIF.sourceTypes[f.tipo].icon, 16)}</div><div class="meta"><b>${esc(f.nome)}</b><small>${DIF.sourceTypes[f.tipo].nome}</small></div>
          <button class="btn sm" data-action="add-fonte-biblioteca" data-did="${d.id}" data-id="${f.id}">${I('plus', 14)}Usar</button></div>`).join('')
          : '<p class="muted" style="margin:8px 0">Todas as fontes da biblioteca já estão nesta descoberta.</p>'}
      </div></div></aside></div>`;
};

/* ============================================================================
   FUTURO ARQUIVO: js/views/etapa-levantamento.js — Etapa 2
   ========================================================================== */
DIF.views.etapaLevantamento = d => {
  const S = DIF.store, I = DIF.icon, ui = DIF.ui, U = DIF.util, esc = U.esc, X = d.extracao;
  const fontes = d.fontes.map(id => S.fonte(id)).filter(Boolean);
  const acoes = `<button class="btn" data-action="nova-regra" data-did="${d.id}">${I('edit', 16)}Cadastrar regra manual</button>`;
  const header = ui.pageHeader({ n: 2, eyebrow: 'Etapa 2 · Levantamento', titulo: 'Levantar as <em>regras atuais</em> nas fontes',
    sub: 'Extração determinística para fontes técnicas e extração assistida para documentos e imagens. Você também pode cadastrar regras que só existem no conhecimento do time.', acoes });
  if (!fontes.length) return header + `<div class="card">${ui.empty({ icon: 'layers', titulo: 'Sem fontes para levantar', texto: 'Volte à etapa 1 e adicione ao menos uma fonte.', acao: `<a class="btn primary" href="#/d/${d.id}/fontes">Ir para Fontes</a>` })}</div>`;

  const tot = DIF.extracao.totais(d), pct = U.pct(tot.feitos, tot.total);
  const multi = d.regras.filter(r => r.evidencias.length > 1).length, conf = d.regras.filter(DIF.regras.temConflito).length;
  const manuais = d.regras.filter(r => r.origem === 'manual').length;
  const novas = fontes.filter(f => !X.porFonte[f.id]).length;
  let botao;
  if (X.status === 'nao_iniciado') botao = `<button class="btn primary lg" data-action="iniciar-levantamento" data-did="${d.id}">${I('play', 16)}Iniciar levantamento</button>`;
  else if (X.status === 'executando') botao = `<button class="btn on-dark lg" data-action="pausar-levantamento" data-did="${d.id}">${I('pause', 16)}Pausar</button>`;
  else if (X.status === 'pausado') botao = `<button class="btn primary lg" data-action="iniciar-levantamento" data-did="${d.id}">${I('play', 16)}Retomar</button>`;
  else botao = `<button class="btn on-dark lg" data-action="iniciar-levantamento" data-did="${d.id}">${I('refresh', 16)}${novas ? `Levantar ${novas} fonte(s) nova(s)` : 'Reexecutar'}</button>`;
  const rotStatus = { nao_iniciado: 'Pronto para iniciar', executando: 'Levantando regras…', pausado: 'Pausado — retome quando quiser', concluido: `Concluído ${X.fim ? U.relativo(X.fim) : ''}` }[X.status];

  const painel = `<div class="run on-dark"><div class="in">
      <div><div class="pct tnum">${pct}<small>%</small></div><div class="lbl">${rotStatus}</div></div>
      <div class="counters"><div><b class="tnum">${U.n(d.regras.length)}</b><small>regras</small></div><div><b class="tnum">${multi}</b><small>em várias fontes</small></div>
        <div><b class="tnum" style="color:${conf ? '#FF8FA5' : '#fff'}">${conf}</b><small>conflitos</small></div><div><b class="tnum">${manuais}</b><small>manuais</small></div></div>${botao}</div>
    <div class="bar"><div class="prog lg ${X.status === 'executando' ? 'busy' : ''}"><span style="width:${pct}%"></span></div></div></div>`;

  const linhas = fontes.map(f => {
    const t = DIF.sourceTypes[f.tipo], p = X.porFonte[f.id], pp = p ? U.pct(p.feitos, p.total) : 0;
    const st = !p ? `<span class="status st-wait"><span class="dot"></span>Aguardando</span>`
      : p.status === 'concluido' ? `<span class="status st-ok">${I('check', 14)}Concluída</span>`
      : X.status === 'executando' ? `<span class="status st-run">${I('refresh', 14, 'class="ic spin"')}Extraindo</span>` : `<span class="status st-wait"><span class="dot"></span>Pausada</span>`;
    const modo = t.classe === 'tecnica' || f.tipo === 'domainpack' ? 'Determinística' : 'Assistida por IA';
    return `<div class="srun">${ui.fonteIcone(f.tipo, t.classe === 'funcional' ? 'red' : '')}
      <div class="meta"><b>${esc(f.nome)}</b><small>${t.nome} · ${modo}</small></div>
      <div><div class="prog ${p && p.status === 'concluido' ? 'ok' : ''}"><span style="width:${pp}%"></span></div><div class="cnt tnum" style="text-align:left;margin-top:6px">${p ? `${p.feitos} de ${p.total} evidências` : 'ainda não levantada'}</div></div>
      <div>${st}</div>
      <div style="text-align:right">${p && p.status === 'concluido' && X.status !== 'executando' ? `<button class="btn sm" data-action="reexecutar-fonte" data-did="${d.id}" data-id="${f.id}">${I('refresh', 13)}Reexecutar</button>` : ''}</div></div>`;
  }).join('');

  const novos = new Set(DIF.ui.feedNovos || []);
  const feedRegras = d.regras.slice(-12).reverse();
  const feed = feedRegras.length ? feedRegras.map(r => `<div class="feed-i ${novos.has(r.key) ? 'new' : ''}">
      <div class="ico-box sm ${r.origem === 'manual' ? 'dark' : ''}">${I(r.origem === 'manual' ? 'edit' : (DIF.sourceTypes[r.evidencias[0]?.tipo] || { icon: 'file' }).icon, 15)}</div>
      <div style="min-width:0"><div class="t">${esc(r.enunciado)}</div><div class="m"><span class="rid">${r.id}</span>${ui.badge(DIF.config.entidades[r.entidade] || r.entidade, 'b-neutral b-sm')}
      ${r.evidencias.length > 1 ? ui.badge(`${r.evidencias.length} fontes`, 'b-tech b-sm') : ''}${DIF.regras.temConflito(r) ? ui.badge('Conflito', 'b-red b-sm', 'alert') : ''}</div></div></div>`).join('')
    : `<div class="card-b explain">
        <div class="e"><div class="ico-box sm">${I('code', 15)}</div><div><b>Fontes técnicas → fato verificado</b><small>Parsers de copybook, DTO, schema e contrato extraem a regra com arquivo e linha.</small></div></div>
        <div class="e"><div class="ico-box sm red">${I('file', 15)}</div><div><b>Documentos → interpretação</b><small>Extração assistida, sempre com o trecho citado como evidência.</small></div></div>
        <div class="e"><div class="ico-box sm red">${I('image', 15)}</div><div><b>Imagens → hipótese</b><small>Telas e fluxos sugerem regras que precisam de confirmação.</small></div></div>
        <div class="e"><div class="ico-box sm dark">${I('scale', 15)}</div><div><b>Duplicadas e conflitos</b><small>A mesma regra em várias fontes vira uma só, com todas as evidências. Se as fontes divergem, a regra é marcada como conflito.</small></div></div></div>`;

  const banner = X.status === 'concluido' ? `<div class="done-banner"><div class="ico-box">${I('check', 20)}</div><div><b>${U.n(d.regras.length)} regras prontas para validação</b>
      <small>${multi} confirmadas por mais de uma fonte · ${conf} conflito(s) entre fontes exigem decisão individual</small></div>
      <div class="r"><a class="btn primary" href="#/d/${d.id}/validacao">Validar regras${I('arrowR', 15)}</a></div></div>` : '';

  return `${header}${banner}${painel}
    <div class="split" style="margin-top:22px"><div class="card"><div class="card-h"><h3>Progresso por fonte</h3><span class="r muted" style="font-size:12.5px">${fontes.length} fonte(s)</span></div>${linhas}</div>
    <div class="card"><div class="card-h"><h3>${feedRegras.length ? 'Regras encontradas' : 'Como funciona'}</h3>${feedRegras.length ? `<span class="r"><a class="link" href="#/d/${d.id}/validacao" style="font-size:12.5px">Ver todas</a></span>` : ''}</div><div class="feed">${feed}</div></div></div>`;
};

/* ============================================================================
   FUTURO ARQUIVO: js/views/tabela-regras.js — tabela paginada, agrupada e com totalizadores
   Reutilizada na Etapa 3 (escopo "d:<id>") e na base de regras (escopo "all").
   ========================================================================== */
DIF.views.tabelaRegras = (scope, regras, opt = {}) => {
  const R = DIF.regras, C = DIF.config, I = DIF.icon, ui = DIF.ui, U = DIF.util, esc = U.esc;
  const st = ui.tbl(scope);
  const tot = R.totais(regras);
  const filtradas = R.ordenar(R.filtrar(regras, st), st.group);
  const pages = Math.max(1, Math.ceil(filtradas.length / st.size));
  if (st.page > pages) st.page = pages;
  const ini = (st.page - 1) * st.size, pagina = filtradas.slice(ini, ini + st.size);
  const dataScope = `data-scope="${scope}"`;

  // totalizadores (clicáveis)
  const kpis = [['', 'Total', tot.total, 'layers', 'var(--ink)'], ['pendente', 'Pendentes', tot.pendentes, 'clock', 'var(--ink-400)', tot.revisao ? `${tot.revisao} em revisão` : 'aguardando decisão'],
    ['aprovada', 'Aprovadas', tot.aprovadas, 'check', 'var(--ok)'], ['rejeitada', 'Rejeitadas', tot.rejeitadas, 'x', 'var(--ink-500)'],
    ['conflito', 'Conflitos', tot.conflitos, 'alert', 'var(--red)', 'decisão individual'], ['semevid', 'Sem evidência', tot.semEvid, 'file', 'var(--warn)', 'sinalizadas']]
    .map(([flag, l, v, ic, cor, s]) => `<button class="card kpi click ${st.flag === flag ? 'on' : ''}" data-action="tbl-flag" ${dataScope} data-flag="${flag}"><span class="acc" style="background:${cor}"></span>
      <div class="l">${I(ic, 14)}${l}</div><div class="v tnum">${U.n(v)}</div><div class="s">${s || (tot.total ? U.pct(v, tot.total) + '% do total' : '—')}</div></button>`).join('');
  const decididas = tot.aprovadas + tot.rejeitadas;

  // filtros
  const fontesMap = {};
  regras.forEach(r => r.evidencias.forEach(e => { fontesMap[e.fonteId] = e.fonteNome; }));
  const sel = (key, rotulo, mapa) => `<select class="sel ${st.f[key] ? 'on' : ''}" data-change="tbl-filtro" ${dataScope} data-key="${key}" aria-label="${rotulo}">${ui.options(mapa, st.f[key], rotulo)}</select>`;
  const entidades = {}; regras.forEach(r => { entidades[r.entidade] = C.entidades[r.entidade] || r.entidade; });
  const descMap = {}; if (opt.showDisc) DIF.store.state.descobertas.forEach(d => { if (d.regras.length) descMap[d.id] = d.nome; });
  const temFiltro = st.q || st.flag || Object.values(st.f).some(Boolean);
  const toolbar = `<div class="toolbar">
    <label class="search">${I('search', 16)}<input id="busca-${scope}" type="search" placeholder="Buscar por regra, campo ou ID" value="${esc(st.q)}" data-input="tbl-busca" ${dataScope} aria-label="Buscar regras"></label>
    ${opt.showDisc ? sel('descoberta', 'Descoberta', descMap) : ''}${sel('status', 'Status', C.status)}${sel('entidade', 'Entidade', entidades)}${sel('operacao', 'Operação', C.operacoes)}
    ${sel('tipo', 'Tipo', C.tiposRegra)}${sel('fonte', 'Fonte', fontesMap)}${sel('classificacao', 'Classificação', C.classificacoes)}${sel('origem', 'Origem', C.origens)}
    ${temFiltro ? `<button class="btn ghost sm" data-action="tbl-limpar" ${dataScope}>${I('x', 14)}Limpar filtros</button>` : ''}</div>`;

  // seleção e ações em lote
  const aprovaveis = filtradas.filter(r => r.status !== 'aprovada' && !R.temConflito(r)).length;
  const conflitosFiltro = filtradas.filter(R.temConflito).length;
  const paginaToda = pagina.length && pagina.every(r => st.sel.has(r.key));
  const selbar = st.sel.size ? `<div class="selbar"><span class="n tnum">${st.sel.size} selecionada(s)</span>
      ${paginaToda && filtradas.length > pagina.length && st.sel.size < filtradas.length ? `<button class="link" data-action="sel-todas-filtro" ${dataScope}>Selecionar todas as ${filtradas.length} do filtro</button>` : ''}
      <button class="link" data-action="sel-limpar" ${dataScope}>Limpar seleção</button>
      <div class="r"><button class="btn sm on-dark" data-action="devolver-selecionadas" ${dataScope}>${I('undo', 14)}Devolver</button>
      <button class="btn sm on-dark" data-action="rejeitar-selecionadas" ${dataScope}>${I('x', 14)}Rejeitar</button>
      <button class="btn sm ok" data-action="aprovar-selecionadas" ${dataScope}>${I('check', 14)}Aprovar selecionadas</button></div></div>`
    : `<div class="tbl-top"><span class="muted" style="font-size:13px"><b class="tnum" style="color:var(--ink)">${U.n(filtradas.length)}</b> regra(s) no filtro${conflitosFiltro ? ` · <span style="color:var(--red)">${conflitosFiltro} em conflito</span>` : ''}</span>
      <div class="r"><span class="muted" style="font-size:12.5px">Agrupar por</span>
      <select class="sel" data-change="tbl-agrupar" ${dataScope} aria-label="Agrupar por">${ui.options(C.agrupamentos, st.group)}</select>
      <button class="btn sm ok" data-action="aprovar-filtro" ${dataScope} ${aprovaveis ? '' : 'disabled'}>${I('check', 14)}Aprovar todas do filtro (${aprovaveis})</button></div></div>`;

  // linhas
  const cols = opt.showDisc ? 9 : 8;
  const gruposTot = {};
  if (st.group !== 'nenhum') filtradas.forEach(r => { const g = R.grupo(r, st.group); const t = gruposTot[g] ||= { n: 0, pend: 0, aprov: 0, conf: 0, keys: [] }; t.n++; t.keys.push(r.key); if (r.status === 'aprovada') t.aprov++; else if (r.status !== 'rejeitada') t.pend++; if (R.temConflito(r)) t.conf++; });
  let ultimo = null, linhas = '';
  for (const r of pagina) {
    if (st.group !== 'nenhum') {
      const g = R.grupo(r, st.group);
      if (g !== ultimo) {
        ultimo = g; const t = gruposTot[g], todos = t.keys.every(k => st.sel.has(k));
        const aprovG = filtradas.filter(x => R.grupo(x, st.group) === g && x.status !== 'aprovada' && !R.temConflito(x)).length;
        linhas += `<tr class="grp"><td class="c-chk"><input type="checkbox" class="chk" data-action="sel-grupo" ${dataScope} data-grupo="${esc(encodeURIComponent(g))}" ${todos ? 'checked' : ''} aria-label="Selecionar grupo"></td>
          <td colspan="${cols - 1}"><div class="grp-in"><b>${esc(g)}</b><span class="muted tnum" style="font-size:12.5px">${t.n} regra(s)</span>
          ${ui.badge(`${t.pend} pendente(s)`, 'b-dashed b-sm')}${ui.badge(`${t.aprov} aprovada(s)`, 'b-ok b-sm')}${t.conf ? ui.badge(`${t.conf} conflito(s)`, 'b-red b-sm') : ''}
          <div class="r"><button class="btn sm" data-action="aprovar-grupo" ${dataScope} data-grupo="${esc(encodeURIComponent(g))}" ${aprovG ? '' : 'disabled'}>${I('check', 13)}Aprovar grupo (${aprovG})</button></div></div></td></tr>`;
      }
    }
    const conf = R.temConflito(r), d = opt.showDisc ? DIF.store.descoberta(r.did) : null;
    const fontesIc = [...new Map(r.evidencias.map(e => [e.fonteId, e])).values()];
    linhas += `<tr class="row ${st.sel.has(r.key) ? 'sel' : ''} ${conf ? 'conf' : ''} ${r.status === 'rejeitada' ? 'rej' : ''}" data-action="abrir-regra" data-key="${r.key}">
      <td class="c-chk"><input type="checkbox" class="chk" data-action="sel-toggle" ${dataScope} data-key="${r.key}" ${st.sel.has(r.key) ? 'checked' : ''} aria-label="Selecionar ${r.id}"></td>
      <td style="min-width:320px"><div class="rtxt">${esc(r.enunciado)}</div><div class="rmeta"><span class="rid">${r.id}</span>${r.campo ? `<span class="mchip">${esc(r.campo)}</span>` : ''}
        ${r.origem === 'manual' ? ui.badge('Manual', 'b-dark b-sm', 'edit') : ''}${conf ? ui.badge(esc(r.conflito.descricao), 'b-red b-sm', 'alert') : ''}${!r.evidencias.length ? ui.badge('Sem evidência', 'b-warn b-sm') : ''}</div></td>
      ${opt.showDisc ? `<td class="cell2" style="max-width:180px"><b style="font-size:12.5px">${esc(d.nome)}</b><small>${esc(d.cluster)}</small></td>` : ''}
      <td class="cell2"><b>${esc(C.entidades[r.entidade] || r.entidade)}</b><small>${C.operacoes[r.operacao] || ''}</small></td>
      <td style="white-space:nowrap;font-size:13px">${C.tiposRegra[r.tipo]}</td>
      <td><div class="sstack">${fontesIc.slice(0, 4).map(e => `<span class="${DIF.sourceTypes[e.tipo].classe === 'funcional' ? 'f' : ''}" title="${esc(e.fonteNome)}">${I(DIF.sourceTypes[e.tipo].icon, 14)}</span>`).join('') || `<span title="Cadastro manual">${I('edit', 14)}</span>`}</div></td>
      <td style="white-space:nowrap">${ui.classifBadge(r)}</td>
      <td>${ui.statusBadge(r)}</td>
      <td class="acts"><button class="icon-btn ok" data-action="aprovar" data-key="${r.key}" data-tip="${conf ? 'Resolva o conflito' : 'Aprovar'}" aria-label="Aprovar" ${r.status === 'aprovada' ? 'disabled' : ''}>${I('check', 17)}</button>
        <button class="icon-btn no" data-action="rejeitar" data-key="${r.key}" data-tip="Rejeitar" aria-label="Rejeitar" ${r.status === 'rejeitada' ? 'disabled' : ''}>${I('x', 17)}</button>
        <button class="icon-btn" data-action="abrir-regra" data-key="${r.key}" aria-label="Detalhes">${I('chevR', 17)}</button></td></tr>`;
  }
  if (!pagina.length) linhas = `<tr><td colspan="${cols}">${ui.empty({ icon: 'search', titulo: 'Nenhuma regra neste filtro', texto: 'Ajuste a busca ou limpe os filtros para ver todas as regras.', acao: temFiltro ? `<button class="btn" data-action="tbl-limpar" ${dataScope}>Limpar filtros</button>` : '' })}</td></tr>`;

  // paginação
  const nums = [];
  for (let p = 1; p <= pages; p++) if (p === 1 || p === pages || Math.abs(p - st.page) <= 1) nums.push(p); else if (nums[nums.length - 1] !== '…') nums.push('…');
  const pager = `<div class="pager"><span class="tnum">Mostrando ${filtradas.length ? ini + 1 : 0}–${Math.min(ini + st.size, filtradas.length)} de ${U.n(filtradas.length)}</span>
    <div class="sp"><button class="pg" data-action="tbl-pagina" ${dataScope} data-p="${st.page - 1}" ${st.page <= 1 ? 'disabled' : ''} aria-label="Página anterior">${I('chevL', 15)}</button>
    ${nums.map(p => p === '…' ? '<span>…</span>' : `<button class="pg tnum ${p === st.page ? 'on' : ''}" data-action="tbl-pagina" ${dataScope} data-p="${p}">${p}</button>`).join('')}
    <button class="pg" data-action="tbl-pagina" ${dataScope} data-p="${st.page + 1}" ${st.page >= pages ? 'disabled' : ''} aria-label="Próxima página">${I('chevR', 15)}</button>
    <select class="sel" data-change="tbl-tamanho" ${dataScope} aria-label="Itens por página">${ui.options(Object.fromEntries(C.pageSizes.map(n => [n, `${n} por página`])), st.size)}</select></div></div>`;

  return `<div class="grid g6" style="margin-bottom:16px">${kpis}</div>
    <div class="valbar"><span>Validadas <b class="tnum">${U.pct(decididas, tot.total)}%</b></span><div class="prog"><span style="width:${U.pct(decididas, tot.total)}%"></span></div><span class="tnum">${decididas} de ${tot.total} decididas</span></div>
    <div class="card" style="overflow:hidden">${toolbar}${selbar}
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c-chk"><input type="checkbox" class="chk" data-action="sel-pagina" ${dataScope} ${paginaToda ? 'checked' : ''} aria-label="Selecionar página"></th>
      <th>Regra</th>${opt.showDisc ? '<th>Descoberta</th>' : ''}<th>Entidade</th><th>Tipo</th><th>Fontes</th><th>Classificação</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>${pager}</div>`;
};

/* ============================================================================
   FUTURO ARQUIVO: js/views/etapa-validacao.js — Etapa 3
   ========================================================================== */
DIF.views.etapaValidacao = d => {
  const I = DIF.icon, ui = DIF.ui;
  const acoes = `<button class="btn" data-action="nova-regra" data-did="${d.id}">${I('plus', 16)}Cadastrar regra</button>`;
  const header = ui.pageHeader({ n: 3, eyebrow: 'Etapa 3 · Validação', titulo: 'Validar as regras <em>antes de virarem fatos</em>',
    sub: 'Aprove individualmente, por grupo ou tudo o que estiver no filtro. Regras em conflito exigem decisão individual e nunca entram na aprovação em lote.', acoes });
  if (!d.regras.length) return header + `<div class="card">${ui.empty({ icon: 'shield', titulo: 'Nenhuma regra para validar', texto: 'Execute o levantamento nas fontes ou cadastre uma regra manualmente.',
    acao: `<div style="display:flex;gap:10px;justify-content:center"><a class="btn primary" href="#/d/${d.id}/levantamento">Ir para Levantamento</a><button class="btn" data-action="nova-regra" data-did="${d.id}">Cadastrar regra</button></div>` })}</div>`;
  return header + DIF.views.tabelaRegras('d:' + d.id, d.regras);
};

/* ============================================================================
   FUTURO ARQUIVO: js/views/etapa-pacotes.js — Etapa 4
   ========================================================================== */
DIF.views.etapaPacotes = d => {
  const I = DIF.icon, ui = DIF.ui, U = DIF.util, C = DIF.config, esc = U.esc;
  const t = DIF.regras.totais(d.regras), b = DIF.pacotes.bloqueios(d);
  const aprov = d.regras.filter(r => r.status === 'aprovada');
  const evid = aprov.reduce((s, r) => s + r.evidencias.length, 0);
  const porEnt = U.groupBy(aprov, r => r.entidade);
  const ultima = d.versoes[d.versoes.length - 1];
  const mud = DIF.pacotes.previa(d);
  const nMud = mud ? mud.adicionados.length + mud.alterados.length + mud.removidos.length : aprov.length;
  const podeGerar = b.aprovadas > 0 && b.conflitos === 0 && nMud > 0;
  const header = ui.pageHeader({ n: 4, eyebrow: 'Etapa 4 · Pacotes', titulo: 'Gerar <em>fatos autenticados</em> e evidências',
    sub: 'Somente regras aprovadas viram fatos. Cada geração cria uma nova versão dos pacotes de domínio, comparável com a anterior.' });

  const resumo = `<div class="card"><div class="card-h"><h3>O que entra nesta versão</h3><span class="r">${ui.badge(`v${(ultima ? ultima.n : 0) + 1}`, 'b-dark')}</span></div><div class="card-b">
      <div class="grid g3" style="margin-bottom:18px">
        <div><div class="muted" style="font-size:12.5px">Fatos</div><div class="tnum" style="font-size:30px;font-weight:650;letter-spacing:-.03em">${U.n(aprov.length)}</div></div>
        <div><div class="muted" style="font-size:12.5px">Evidências</div><div class="tnum" style="font-size:30px;font-weight:650;letter-spacing:-.03em">${U.n(evid)}</div></div>
        <div><div class="muted" style="font-size:12.5px">Pacotes</div><div class="tnum" style="font-size:30px;font-weight:650;letter-spacing:-.03em">${Object.keys(porEnt).length}</div></div></div>
      <table class="tbl" style="border:1px solid var(--ink-200);border-radius:12px;overflow:hidden"><thead><tr><th>Pacote</th><th>Fatos</th><th>Evidências</th><th>Fontes</th></tr></thead><tbody>
      ${Object.entries(porEnt).map(([ent, rs]) => `<tr><td><b>${esc(d.cluster)} · ${esc(C.entidades[ent] || ent)}</b><div class="rid">pk-${U.slug(d.cluster)}-${ent}</div></td>
        <td class="tnum">${rs.length}</td><td class="tnum">${rs.reduce((s, r) => s + r.evidencias.length, 0)}</td><td class="tnum">${new Set(rs.flatMap(r => r.evidencias.map(e => e.fonteId))).size}</td></tr>`).join('') || `<tr><td colspan="4" class="muted">Nenhuma regra aprovada ainda.</td></tr>`}
      </tbody></table></div></div>`;
  const fora = `<div class="card"><div class="card-h"><h3>Ficam de fora</h3></div><div class="card-b pk-sum">
      <div class="rowi">${I('clock', 16)}Pendentes ou em revisão<b class="tnum">${t.pendentes}</b></div>
      <div class="rowi">${I('x', 16)}Rejeitadas<b class="tnum">${t.rejeitadas}</b></div>
      <div class="rowi" style="color:${t.conflitos ? 'var(--red)' : ''}">${I('alert', 16)}Em conflito<b class="tnum">${t.conflitos}</b></div>
      ${b.semEvid ? `<div class="rowi" style="color:var(--warn)">${I('file', 16)}Aprovadas sem evidência (entram sinalizadas)<b class="tnum">${b.semEvid}</b></div>` : ''}
      ${t.pendentes ? `<a class="btn sm" style="margin-top:12px;align-self:flex-start" href="#/d/${d.id}/validacao">${I('shield', 14)}Voltar à validação</a>` : ''}
      <button class="btn primary lg" style="margin-top:18px;width:100%" data-action="gerar-pacotes" data-did="${d.id}" ${podeGerar ? '' : 'disabled'}>${I('sparkles', 17)}Gerar pacotes · v${(ultima ? ultima.n : 0) + 1}</button>
      <div class="muted" style="font-size:12.5px;margin-top:10px;text-align:center">${!b.aprovadas ? 'Aprove ao menos uma regra.' : b.conflitos ? 'Há regras aprovadas com conflito aberto.' : !mud ? 'Primeira versão desta descoberta' : nMud ? `Desde a v${ultima.n}: +${mud.adicionados.length} novos · ~${mud.alterados.length} alterados · −${mud.removidos.length} removidos` : `Sem mudanças desde a v${ultima.n}`}</div>
    </div></div>`;

  let versoes = '';
  if (d.versoes.length) {
    const seln = DIF.ui.pacoteSel[d.id] || ultima.n, v = d.versoes.find(x => x.n === seln) || ultima;
    const lista = [...d.versoes].reverse().map(x => `<div class="ver ${x.n === v.n ? 'on' : ''}" data-action="ver-versao" data-did="${d.id}" data-n="${x.n}">
      <div class="vn tnum">v${x.n}</div><div class="meta"><b>${x.totais.fatos} fatos · ${x.totais.pacotes} pacote(s)</b><small>${x.totais.evidencias} evidências · ${U.dataHora(x.criadoEm)} · ${esc(x.por)}</small></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${x.status === 'publicado' ? ui.badge('Publicado', 'b-ok b-sm', 'send') : ui.badge('Gerado', 'b-dashed b-sm')}
      ${x.diff ? `<div class="diffc">${ui.badge('+' + x.diff.adicionados.length, 'b-ok b-sm')}${ui.badge('~' + x.diff.alterados.length, 'b-warn b-sm')}${ui.badge('−' + x.diff.removidos.length, 'b-red b-sm')}</div>` : ui.badge('Inicial', 'b-neutral b-sm')}</div></div>`).join('');
    const pacotes = v.pacotes.map(p => `<div class="card pkg"><div class="h"><div class="ico-box red">${I('box', 20)}</div><div style="min-width:0"><b>${esc(p.nome)}</b><small>${p.id} · #${p.hash}</small></div></div>
      <div class="nums"><div><b class="tnum">${p.fatos.length}</b><small>fatos</small></div><div><b class="tnum">${p.evidencias}</b><small>evidências</small></div><div><b class="tnum">${p.fatos.filter(f => f.classificacao === 'fato').length}</b><small>verificados</small></div></div>
      <div class="acts"><button class="btn sm" data-action="ver-conteudo" data-did="${d.id}" data-n="${v.n}" data-pk="${p.id}">${I('eye', 14)}Ver conteúdo</button>
      <button class="btn sm" data-action="baixar-pacote" data-did="${d.id}" data-n="${v.n}" data-pk="${p.id}">${I('download', 14)}Baixar</button></div></div>`).join('');
    const df = v.diff;
    const diffHtml = df ? `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Mudanças desde a v${v.n - 1}</h3></div><div class="card-b dl">
        ${[...df.adicionados.map(x => ['add', '+', x]), ...df.alterados.map(x => ['alt', '~', x]), ...df.removidos.map(x => ['rem', '−', x])].slice(0, 12)
          .map(([c, s, x]) => `<div class="di ${c}"><span class="s">${s}</span><span class="rid" style="width:84px;flex-shrink:0">${x.id}</span><span>${esc(x.enunciado)}</span></div>`).join('') || '<span class="muted">Sem mudanças.</span>'}
        ${df.adicionados.length + df.alterados.length + df.removidos.length > 12 ? `<span class="muted" style="font-size:12.5px">e mais ${df.adicionados.length + df.alterados.length + df.removidos.length - 12} mudança(s)</span>` : ''}</div></div>` : '';
    versoes = `<div class="sec-t"><h2>Versões</h2><span class="sub">${d.versoes.length} versão(ões) geradas</span></div>
      <div class="vers">${lista}</div><div><div class="card" style="padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px">
          <div><div class="eyebrow"><span class="line"></span>Versão ${v.n}</div><div style="font-size:18px;font-weight:650;margin-top:4px">${v.totais.pacotes} pacote(s) · ${v.totais.fatos} fatos</div>
          <div class="muted" style="font-size:12.5px">${v.status === 'publicado' ? `Publicado em domain-packs/${U.slug(d.cluster)} · ${U.dataHora(v.publicadoEm)}` : 'Ainda não publicado'}</div></div>
          <div style="margin-left:auto;display:flex;gap:8px"><button class="btn" data-action="ver-conteudo" data-did="${d.id}" data-n="${v.n}">${I('eye', 15)}Ver tudo</button>
          <button class="btn" data-action="baixar-pacote" data-did="${d.id}" data-n="${v.n}">${I('download', 15)}Baixar</button>
          <button class="btn dark" data-action="publicar-versao" data-did="${d.id}" data-n="${v.n}" ${v.status === 'publicado' ? 'disabled' : ''}>${I('send', 15)}${v.status === 'publicado' ? 'Publicado' : 'Publicar'}</button></div></div>
        <div class="grid g3">${pacotes}</div>${diffHtml}</div>`;
  }
  return `${header}<div class="split">${resumo}${fora}</div>${versoes}`;
};

/* ============================================================================
   FUTURO ARQUIVO: js/views/bases.js — Biblioteca de fontes, base de regras e pacotes
   ========================================================================== */
DIF.views.fontes = () => {
  const S = DIF.store, I = DIF.icon, ui = DIF.ui, filtro = ui.bibFiltro;
  const lista = S.state.fontes.filter(f => !filtro || f.tipo === filtro);
  const chips = [['', 'Todas', S.state.fontes.length], ...Object.entries(DIF.sourceTypes).map(([k, t]) => [k, t.nome, S.state.fontes.filter(f => f.tipo === k).length])]
    .map(([k, l, n]) => `<button class="chip ${filtro === k ? 'on' : ''}" data-action="bib-filtro" data-tipo="${k}">${l}<span class="tnum" style="opacity:.6">${n}</span></button>`).join('');
  return `${ui.pageHeader({ eyebrow: 'Bases · Biblioteca de fontes', titulo: 'Fontes <em>reutilizáveis</em> entre descobertas',
      sub: 'Cadastre uma vez e use em qualquer descoberta. As credenciais ficam no servidor e nunca são exibidas no navegador.',
      acoes: `<button class="btn primary" data-action="escolher-tipo-fonte">${I('plus', 16)}Nova fonte</button>` })}
    <div class="chips" style="margin-bottom:16px">${chips}</div>
    ${lista.length ? lista.map(f => {
      const usadas = S.state.descobertas.filter(d => d.fontes.includes(f.id));
      return DIF.views.fonteItem(f, { extra: `<small style="margin-top:2px">${DIF.icon('compass', 12, 'style="vertical-align:-2px"')} ${usadas.length ? 'Usada em: ' + usadas.map(d => DIF.util.esc(d.nome)).join(', ') : 'Ainda não usada em descobertas'}</small>` });
    }).join('') : `<div class="card">${ui.empty({ icon: 'layers', titulo: 'Nenhuma fonte deste tipo', texto: 'Cadastre uma nova fonte para reutilizá-la nas descobertas.' })}</div>`}`;
};

DIF.views.regras = () => DIF.ui.pageHeader({ eyebrow: 'Bases · Regras', titulo: 'Base de <em>regras</em> de todas as descobertas',
  sub: 'Os mesmos filtros, agrupamentos e ações da validação, agora sobre todas as descobertas.' }) +
  (DIF.store.todasRegras().length ? DIF.views.tabelaRegras('all', DIF.store.todasRegras(), { showDisc: true })
    : `<div class="card">${DIF.ui.empty({ icon: 'list', titulo: 'Nenhuma regra ainda', texto: 'As regras aparecem aqui conforme as descobertas avançam.' })}</div>`);

DIF.views.pacotes = () => {
  const I = DIF.icon, ui = DIF.ui, U = DIF.util, esc = U.esc;
  const todas = DIF.store.todasVersoes().sort((a, b) => b.v.criadoEm - a.v.criadoEm);
  const linhas = todas.map(({ d, v }) => `<tr class="row" data-action="nav" data-to="d/${d.id}/pacotes" data-did="${d.id}" data-n="${v.n}">
      <td><b>${esc(d.nome)}</b><div class="rid">${d.id} · ${esc(d.cluster)}</div></td><td>${ui.badge('v' + v.n, 'b-dark')}</td>
      <td class="tnum">${v.totais.pacotes}</td><td class="tnum">${v.totais.fatos}</td><td class="tnum">${v.totais.evidencias}</td>
      <td>${v.diff ? `<div class="diffc">${ui.badge('+' + v.diff.adicionados.length, 'b-ok b-sm')}${ui.badge('~' + v.diff.alterados.length, 'b-warn b-sm')}${ui.badge('−' + v.diff.removidos.length, 'b-red b-sm')}</div>` : ui.badge('Inicial', 'b-neutral b-sm')}</td>
      <td class="tnum">${U.dataHora(v.criadoEm)}</td><td>${v.status === 'publicado' ? ui.badge('Publicado', 'b-ok', 'send') : ui.badge('Gerado', 'b-dashed')}</td>
      <td class="acts"><button class="icon-btn" data-action="ver-conteudo" data-did="${d.id}" data-n="${v.n}" aria-label="Ver conteúdo">${I('eye', 16)}</button>
      <button class="icon-btn" data-action="baixar-pacote" data-did="${d.id}" data-n="${v.n}" aria-label="Baixar">${I('download', 16)}</button></td></tr>`).join('');
  return `${ui.pageHeader({ eyebrow: 'Bases · Pacotes', titulo: 'Pacotes de domínio <em>versionados</em>', sub: 'Todas as versões geradas pelas descobertas, com o que mudou em cada uma.' })}
    <div class="card" style="overflow:hidden">${todas.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Descoberta</th><th>Versão</th><th>Pacotes</th><th>Fatos</th><th>Evidências</th><th>Mudanças</th><th>Gerado em</th><th>Status</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`
      : ui.empty({ icon: 'box', titulo: 'Nenhum pacote gerado', texto: 'Aprove regras em uma descoberta e gere a primeira versão na etapa 4.' })}</div>`;
};

/* ============================================================================
   FUTURO ARQUIVO: js/ui/overlays.js — gaveta de detalhe da regra e modais
   ========================================================================== */
DIF.overlays = {};
DIF.overlays.drawerRegra = dw => {
  const r = DIF.store.regra(dw.key);
  if (!r) return '';
  const I = DIF.icon, ui = DIF.ui, U = DIF.util, C = DIF.config, esc = U.esc, R = DIF.regras;
  const d = DIF.store.descoberta(r.did), conf = R.temConflito(r);
  let conflito = '';
  if (r.conflito && r.conflito.versoes.length > 1) {
    const res = r.conflito.resolucao;
    conflito = `<div class="dsec"><div class="conflict"><div class="t">${I('alert', 18)}As fontes divergem: ${esc(r.conflito.descricao)}</div>
      <p>Escolha a versão vigente ou registre como divergência a investigar. Enquanto o conflito estiver aberto, a regra não pode ser aprovada.</p>
      <div class="versions">${r.conflito.versoes.map((v, i) => `<div class="version ${res === i ? 'chosen' : ''}">
          <div style="display:flex;gap:6px;align-items:center">${ui.fonteIcone(v.tipo, 'sm')}<div style="min-width:0"><b style="font-size:13px">${esc(v.fonteNome)}</b><div class="ref">${esc(v.referencia)}</div></div></div>
          <div class="val">${esc(v.valor)}</div><pre class="code">${esc(U.mask(v.trecho))}</pre>
          ${res === i ? `<span class="badge b-ok">${I('check', 13)}Versão vigente</span>` : `<button class="btn sm" data-action="resolver-conflito" data-key="${r.key}" data-idx="${i}">Usar esta versão</button>`}</div>`).join('')}</div>
      ${res != null ? `<div class="resolved">${I('check', 16)}Resolvido: vale "${esc(r.conflito.versoes[res].valor)}" (${esc(r.conflito.versoes[res].fonteNome)})<button class="link" data-action="desfazer-resolucao" data-key="${r.key}">Desfazer</button></div>`
        : r.conflito.divergencia ? `<div class="resolved warn">${I('alert', 16)}Registrada como divergência a investigar<button class="link" data-action="desfazer-resolucao" data-key="${r.key}">Desfazer</button></div>`
        : `<div style="margin-top:10px"><button class="btn sm ghost" data-action="divergencia" data-key="${r.key}">${I('scale', 14)}Registrar como divergência a investigar</button></div>`}
    </div></div>`;
  }
  const evid = r.evidencias.length ? r.evidencias.map(e => `<div class="ev"><div class="ev-h">${ui.fonteIcone(e.tipo, 'sm')}<div style="min-width:0"><b>${esc(e.fonteNome)}</b><div class="muted" style="font-size:12px">${DIF.sourceTypes[e.tipo].nome} · ${esc(e.versao)}</div></div>
      <div class="r">${ui.classeBadge(DIF.sourceTypes[e.tipo].classe)}</div></div>
      <div class="muted mono" style="font-size:12px;margin-bottom:6px">${esc(e.arquivo)} · ${esc(e.linha)}</div>
      <pre class="code">${/^\d+$/.test(e.linha) ? `<span class="ln">${e.linha}</span>` : ''}${esc(U.mask(e.trecho))}</pre></div>`).join('')
    : `<div class="ev" style="background:var(--warn-soft);border-color:rgba(168,107,18,.25);color:var(--warn);font-size:13px">${I('alert', 15, 'style="vertical-align:-3px"')} Regra sem evidência. Pode ser aprovada, mas entra no pacote sinalizada.</div>`;
  const rel = R.relacionadas(r);
  const hist = [...r.historico].reverse().map(h => `<div class="tl-i"><b>${esc(h.acao)}</b><small>${esc(h.quem)} · ${U.dataHora(h.quando)}</small>${h.motivo ? `<div class="why">${esc(h.motivo)}</div>` : ''}</div>`).join('');
  const titulo = dw.editando
    ? `<textarea class="inp" id="edit-enunciado" style="margin-top:12px;font-size:15px">${esc(r.enunciado)}</textarea><div class="muted" style="font-size:12px;margin-top:6px">${r.status === 'aprovada' ? 'Editar uma regra aprovada devolve a regra para pendente.' : 'A edição fica registrada no histórico.'}</div>`
    : `<h2>${esc(r.enunciado)}</h2>`;
  const meta = [['Entidade', C.entidades[r.entidade] || r.entidade], ['Operação', C.operacoes[r.operacao] || '—'], ['Campo', r.campo || '—'], ['Tipo', C.tiposRegra[r.tipo]],
    ['Origem', C.origens[r.origem]], ['Fonte', { tecnica: 'Técnica', funcional: 'Funcional', ambas: 'Técnica + funcional' }[r.fonteClasse]],
    ['Classificação', `${C.classificacoes[r.classificacao]} · ${Math.round(r.confianca * 100)}%`], ['Descoberta', d.nome]];
  const rodape = dw.editando
    ? `<button class="btn ghost" data-action="cancelar-edicao">Cancelar</button><div class="r"><button class="btn primary" data-action="salvar-edicao" data-key="${r.key}">${I('check', 15)}Salvar edição</button></div>`
    : `<button class="btn ghost" data-action="editar-regra">${I('edit', 15)}Editar</button><div class="r">
        <button class="btn" data-action="rejeitar" data-key="${r.key}" ${r.status === 'rejeitada' ? 'disabled' : ''}>${I('x', 15)}Rejeitar</button>
        <button class="btn" data-action="devolver" data-key="${r.key}" ${r.status === 'revisao' ? 'disabled' : ''}>${I('undo', 15)}Devolver</button>
        <button class="btn ok" data-action="aprovar" data-key="${r.key}" ${conf || r.status === 'aprovada' ? 'disabled' : ''} ${conf ? 'data-tip="Resolva o conflito antes"' : ''}>${I('check', 15)}${r.status === 'aprovada' ? 'Aprovada' : 'Aprovar'}</button></div>`;
  return `<aside class="drawer" role="dialog" aria-modal="true" aria-label="Detalhe da regra ${r.id}">
    <div class="drawer-h"><div class="top"><span class="rid" style="font-size:13px">${r.id}</span>${ui.statusBadge(r)}${r.origem === 'manual' ? ui.badge('Manual', 'b-dark b-sm', 'edit') : ''}
      <button class="icon-btn x" data-action="fechar-drawer" aria-label="Fechar">${I('x', 18)}</button></div>${titulo}
      <div class="rmeta" style="margin-top:10px">${ui.badge(esc(C.entidades[r.entidade] || r.entidade), 'b-neutral b-sm')}${ui.badge(C.operacoes[r.operacao] || '', 'b-neutral b-sm')}${r.campo ? `<span class="mchip">${esc(r.campo)}</span>` : ''}${ui.classeBadge(r.fonteClasse)}</div></div>
    <div class="drawer-b">${conflito}
      <div class="dsec"><h4>${I('list', 13)}Metadados</h4><div class="meta-grid">${meta.map(([l, v]) => `<div><small>${l}</small><b>${esc(v)}</b></div>`).join('')}</div></div>
      <div class="dsec"><h4>${I('quote', 13)}Evidências (${r.evidencias.length})</h4>${evid}</div>
      ${rel.length ? `<div class="dsec"><h4>${I('link', 13)}Regras relacionadas</h4>${rel.map(x => `<div class="lib-i" style="cursor:pointer" data-action="abrir-regra" data-key="${x.key}"><span class="rid" style="width:64px">${x.id}</span><div class="meta"><b style="font-weight:500;white-space:normal">${esc(x.enunciado)}</b></div>${ui.statusBadge(x)}</div>`).join('')}</div>` : ''}
      <div class="dsec"><h4>${I('clock', 13)}Histórico</h4><div class="tl">${hist}</div></div></div>
    <div class="drawer-f">${rodape}</div></aside>`;
};

        ? `<select class="inp" id="f-${c.k}" name="${c.k}">${c.ops.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
        : `<input class="inp" id="f-${c.k}" name="${c.k}" placeholder="${esc(c.ph || '')}" ${c.req ? 'required' : ''}>`}</div>`).join('');
    return { titulo: t.nome, sub: `${t.desc} · fonte ${t.classe === 'tecnica' ? 'técnica' : 'funcional'}`, icon: t.icon,
      corpo: `<form id="mform" data-submit="conectar-fonte"><div class="field"><label for="f-nomefonte">Nome da fonte *</label><input class="inp" id="f-nomefonte" name="nome" required placeholder="Como esta fonte vai aparecer nas regras"></div>${campos}
        <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--ink-100);font-size:12.5px;color:var(--ink-700);margin-top:4px">${DIF.icon('shield', 16)}
        <span>${t.classe === 'tecnica' ? 'Regras desta fonte são extraídas de forma determinística e nascem como <b>fato verificado</b>.' : t.icon === 'image' ? 'Regras de imagens nascem como <b>hipótese</b> e precisam de confirmação.' : 'Regras de documentos nascem como <b>interpretação</b>, sempre com o trecho citado.'} Credenciais ficam no servidor.</span></div></form>`,
      rodape: m.testando ? `<button class="btn" disabled>${DIF.icon('refresh', 15, 'class="ic spin"')}Testando conexão…</button>`
        : `<button class="btn" data-action="${m.did ? 'fechar-modal' : 'escolher-tipo-fonte'}">${m.did ? 'Cancelar' : 'Voltar'}</button><button class="btn primary" type="submit" form="mform">${DIF.icon('plug', 15)}Testar e conectar</button>` };

  'regra-manual': m => {

    return { titulo: 'Cadastrar regra', sub: 'Regras manuais passam pela mesma validação das regras levantadas.', icon: 'edit', wide: true,
      corpo: `<form id="mform" data-submit="salvar-regra"><div class="field"><label for="r-en">Enunciado da regra *</label><textarea class="inp" id="r-en" name="enunciado" required placeholder="Escreva em linguagem de negócio. Ex.: Garantia em processo judicial não pode ser excluída."></textarea></div>
        <div class="grid g3" style="gap:12px"><div class="field"><label for="r-ent">Entidade</label><select class="inp" id="r-ent" name="entidade">${ui.options(C.entidades)}</select></div>

        <div class="grid g2" style="gap:12px"><div class="field"><label for="r-cp">Campo (opcional)</label><input class="inp" id="r-cp" name="campo" placeholder="ex.: motivo_bloqueio"></div>
        <div class="field"><label for="r-cl">Natureza da regra</label><select class="inp" id="r-cl" name="classe"><option value="funcional">Funcional (negócio)</option><option value="tecnica">Técnica (implementação)</option></select></div></div>
        <div class="dsec" style="margin-top:6px"><h4>${DIF.icon('quote', 13)}Evidência (opcional, recomendada)</h4>
        <div class="grid g2" style="gap:12px"><div class="field"><label for="r-ref">Referência</label><input class="inp" id="r-ref" name="referencia" placeholder="Documento, arquivo ou ata · seção/linha"></div>
        <div class="field"><label for="r-tr">Trecho</label><input class="inp" id="r-tr" name="trecho" placeholder="Citação que sustenta a regra"></div></div>
        <small class="muted">Sem evidência, a regra é sinalizada e nasce como hipótese.</small></div></form>`,
      rodape: `<button class="btn" data-action="fechar-modal">Cancelar</button><button class="btn primary" type="submit" form="mform">${DIF.icon('plus', 15)}Cadastrar regra</button>` };

  rejeitar: m => ({ titulo: m.keys.length > 1 ? `Rejeitar ${m.keys.length} regras` : 'Rejeitar regra', sub: 'O motivo fica no histórico de cada regra.', icon: 'x',
    corpo: `<form id="mform" data-submit="confirmar-rejeicao"><div class="chips" style="margin-bottom:12px">${DIF.config.motivosRejeicao.map(x => `<button type="button" class="chip" data-action="motivo-rapido" data-motivo="${x}">${x}</button>`).join('')}</div>
      <div class="field"><label for="m-mot">Motivo *</label><textarea class="inp" id="m-mot" name="motivo" required placeholder="Por que esta regra não deve virar fato?"></textarea></div></form>`,
    rodape: `<button class="btn" data-action="fechar-modal">Cancelar</button><button class="btn primary" type="submit" form="mform">${DIF.icon('x', 15)}Rejeitar</button>` }),

  confirmar: m => ({ titulo: m.titulo, sub: m.sub, icon: m.icon || 'alert', corpo: m.corpo || '',
    rodape: `<button class="btn" data-action="fechar-modal">Cancelar</button><button class="btn ${m.classe || 'primary'}" data-action="${m.acao}" ${Object.entries(m.dados || {}).map(([k, v]) => `data-${k}="${DIF.util.esc(v)}"`).join(' ')}>${m.botao}</button>` }),

  gerando: m => ({ titulo: 'Gerando pacotes', sub: 'Transformando regras aprovadas em fatos autenticados.', icon: 'sparkles',
    corpo: `<div class="gen-steps">${['Consolidando fatos das regras aprovadas', 'Vinculando evidências e versões das fontes', 'Calculando assinaturas (hash) dos fatos', 'Versionando e comparando com a versão anterior']
      .map((t, i) => `<div class="gen-s ${i < m.passo ? 'ok' : i === m.passo ? 'on' : ''}"><span class="c">${i < m.passo ? DIF.icon('check', 13) : i === m.passo ? DIF.icon('refresh', 13, 'class="ic spin"') : ''}</span>${t}</div>`).join('')}</div>
      <div class="prog lg busy" style="margin-top:16px"><span style="width:${(m.passo / 4) * 100}%"></span></div>`, rodape: '' }),

  conteudo: m => {
    const d = DIF.store.descoberta(m.did), v = d.versoes.find(x => x.n === +m.n);
    const obj = DIF.pacotes.conteudo(d, v, m.pk);
    return { titulo: m.pk ? `Conteúdo · ${m.pk}` : `Conteúdo da versão ${v.n}`, sub: `${obj.pacotes.reduce((s, p) => s + p.fatos.length, 0)} fatos · documentos mascarados`, icon: 'box', wide: true,
      corpo: `<pre class="json">${DIF.util.jsonHtml(obj)}</pre>`,
      rodape: `<button class="btn" data-action="fechar-modal">Fechar</button><button class="btn primary" data-action="baixar-pacote" data-did="${m.did}" data-n="${m.n}" ${m.pk ? `data-pk="${m.pk}"` : ''}>${DIF.icon('download', 15)}Baixar JSON</button>` };

};

DIF.overlays.render = () => {
  const ui = DIF.ui, el = document.getElementById('overlay');
  let html = '';
  if (ui.drawer) html += `<div class="backdrop" data-action="fechar-drawer"></div>${DIF.overlays.drawerRegra(ui.drawer)}`;
  if (ui.modal) {
    const m = DIF.modais[ui.modal.tipo](ui.modal);
    html += `<div class="backdrop top" ${ui.modal.tipo === 'gerando' ? '' : 'data-action="fechar-modal"'}></div>
      <div class="modal ${m.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${DIF.util.esc(m.titulo)}">
      <div class="modal-h"><div class="ico-box red">${DIF.icon(m.icon, 20)}</div><div><h3>${m.titulo}</h3>${m.sub ? `<p>${m.sub}</p>` : ''}</div>
      ${ui.modal.tipo === 'gerando' ? '' : `<button class="icon-btn x" data-action="fechar-modal" aria-label="Fechar">${DIF.icon('x', 18)}</button>`}</div>
      <div class="modal-b">${m.corpo}</div>${m.rodape ? `<div class="modal-f">${m.rodape}</div>` : ''}</div>`;
  }
  const chave = JSON.stringify([ui.drawer && ui.drawer.key, ui.modal && ui.modal.tipo]);
  el.classList.toggle('still', chave === DIF.overlays.ultimaChave);
  DIF.overlays.ultimaChave = chave;
  el.innerHTML = html;
  const auto = el.querySelector('[autofocus]');
  if (auto && !el.classList.contains('still')) auto.focus();
};

/* ============================================================================
   FUTURO ARQUIVO: js/core/actions.js — todas as ações da interface (delegação de eventos)
   Elementos usam data-action (clique), data-change, data-input e data-submit (formulários).
   ========================================================================== */
DIF.actions = (() => {
  const S = DIF.store, R = DIF.regras, ui = DIF.ui, U = DIF.util, C = DIF.config;
  const render = () => DIF.app.render();
  const desc = el => S.descoberta(el.dataset.did);
  const abrirModal = m => { ui.modal = m; DIF.overlays.render(); };
  const fecharModal = () => { ui.modal = null; DIF.overlays.render(); };
  const keysDe = scope => [...ui.tbl(scope).sel];
  const grupoKeys = el => {
    const scope = el.dataset.scope, st = ui.tbl(scope), g = decodeURIComponent(el.dataset.grupo);
    return R.filtrar(ui.regrasDoEscopo(scope), st).filter(r => R.grupo(r, st.group) === g).map(r => r.key);
  };
  function aprovarKeys(keys, contexto) {
    let ok = 0, conflito = 0;
    S.commit(() => keys.forEach(k => { const r = S.regra(k); if (!r || r.status === 'aprovada') return; if (R.aprovar(r)) ok++; else conflito++; }));
    ui.toast(`${ok} regra(s) aprovada(s)${conflito ? ` · ${conflito} em conflito ficaram de fora` : ''}${contexto ? ' · ' + contexto : ''}`, conflito ? 'warn' : 'ok');
  }
  let debounce;

  const A = {
    nav: el => DIF.router.go(el.dataset.to),
    'restaurar-demo': () => abrirModal({ tipo: 'confirmar', titulo: 'Restaurar demonstração?', sub: 'Todos os dados locais voltam ao estado inicial fictício.', acao: 'restaurar-demo-ok', botao: 'Restaurar', icon: 'refresh' }),
    'restaurar-demo-ok': () => { S.reset(); ui.tabelas = {}; ui.modal = null; ui.drawer = null; DIF.router.go('descobertas'); render(); ui.toast('Demonstração restaurada'); },

    // descobertas
    'nova-descoberta': () => abrirModal({ tipo: 'nova-descoberta' }),
    'criar-descoberta': form => {
      const v = Object.fromEntries(new FormData(form));
      if (!v.nome.trim()) return;
      const id = S.commit(s => { s.seq.d++; const id = `D-${U.pad(s.seq.d, 3)}`; s.descobertas.unshift(DIF.mock.novaDescoberta(id, v.nome.trim(), v.demanda.trim(), v.cluster)); return id; });
      ui.modal = null; DIF.router.go(`d/${id}/fontes`); ui.toast('Descoberta criada · escolha as fontes');
    },
    'concluir-descoberta': el => { ui.toast(`Descoberta "${desc(el).nome}" salva`, 'ok'); DIF.router.go('descobertas'); },

    // fontes
    'escolher-tipo-fonte': () => abrirModal({ tipo: 'escolher-tipo' }),
    'abrir-tipo-fonte': el => abrirModal({ tipo: 'fonte', fonteTipo: el.dataset.tipo, did: el.dataset.did || null, arquivos: [] }),
    'conectar-fonte': form => {
      const m = ui.modal, t = DIF.sourceTypes[m.fonteTipo], v = Object.fromEntries(new FormData(form));
      if (t.upload && !m.arquivos.length) { ui.toast('Selecione ao menos um arquivo', 'err'); return; }
      const config = { ...v }; delete config.arquivos;
      m.testando = true; DIF.overlays.render();
      setTimeout(() => {
        const falhou = /erro|falha/i.test(Object.values(config).join(' '));
        const id = S.commit(s => {
          s.seq.f++; const id = `F-${U.pad(s.seq.f, 2)}`;
          const detalhe = t.upload ? `${m.arquivos.length} arquivo(s)` : Object.values(config).filter(Boolean).slice(1).join(' · ') || t.desc;
          const preview = t.upload ? m.arquivos.length * (m.fonteTipo === 'imagem' ? 1 : 16) : 5 + Math.round(Math.random() * 400);
          s.fontes.push({ id, tipo: m.fonteTipo, nome: v.nome.trim(), detalhe, versao: t.upload ? 'enviado agora' : 'atual', preview, status: falhou ? 'erro' : 'conectada',
            testadoEm: Date.now(), criadaEm: Date.now(), config: t.upload ? { arquivos: m.arquivos } : config });
          if (m.did) S.descoberta(m.did).fontes.push(id);
          return id;
        });
        ui.modal = null; render();
        ui.toast(falhou ? 'Fonte adicionada, mas a conexão falhou. Revise e teste de novo.' : `Fonte conectada${m.did ? ' à descoberta' : ' à biblioteca'}`, falhou ? 'err' : 'ok');
        void id;
      }, 1100);
    },
    'arquivos-fonte': el => {
      ui.modal.arquivos = [...el.files].map(f => ({ nome: f.name, tamanho: f.size }));
      document.getElementById('lista-arquivos').innerHTML = ui.modal.arquivos.map(f => `<div>${DIF.icon('file', 14)}${U.esc(f.nome)}<span class="muted" style="margin-left:auto">${Math.max(1, Math.round(f.tamanho / 1024))} KB</span></div>`).join('');
    },
    'add-fonte-biblioteca': el => { S.commit(() => desc(el).fontes.push(el.dataset.id)); render(); ui.toast('Fonte adicionada · levante as regras dela na etapa 2'); },
    'remover-fonte': el => { S.commit(() => { const d = desc(el); d.fontes = d.fontes.filter(id => id !== el.dataset.id); delete d.extracao.porFonte[el.dataset.id]; }); render(); ui.toast('Fonte removida da descoberta · as regras já levantadas foram mantidas', 'info'); },
    'excluir-fonte': el => { S.commit(s => { s.fontes = s.fontes.filter(f => f.id !== el.dataset.id); }); render(); ui.toast('Fonte excluída da biblioteca'); },
    'testar-fonte': el => {
      const f = S.fonte(el.dataset.id); f.status = 'testando'; render();
      setTimeout(() => { S.commit(() => { f.status = /erro|falha/i.test(f.nome) ? 'erro' : 'conectada'; f.testadoEm = Date.now(); }); render(); ui.toast(f.status === 'conectada' ? `${f.nome}: conexão ok` : `${f.nome}: falha na conexão`, f.status === 'conectada' ? 'ok' : 'err'); }, 900);
    },
    'bib-filtro': el => { ui.bibFiltro = el.dataset.tipo; render(); },

    // levantamento
    'iniciar-levantamento': el => DIF.extracao.iniciar(desc(el)),
    'pausar-levantamento': el => DIF.extracao.pausar(desc(el)),
    'reexecutar-fonte': el => DIF.extracao.iniciar(desc(el), [el.dataset.id]),

    // regra manual
    'nova-regra': el => abrirModal({ tipo: 'regra-manual', did: el.dataset.did }),
    'salvar-regra': form => {
      const v = Object.fromEntries(new FormData(form)), did = ui.modal.did;
      if (!v.enunciado.trim()) return;
      const key = S.commit(s => {
        const d = S.descoberta(did); s.seq.m++;
        const r = DIF.mock.materializar(d, { id: `M-${U.pad(s.seq.m, 4)}`, entidade: v.entidade, operacao: v.operacao, tipo: v.tipo, campo: v.campo.trim() || null, enunciado: v.enunciado.trim(), conflito: null }, Date.now(), C.usuario);
        r.origem = 'manual'; r.fonteClasse = v.classe; r.historico[0].acao = 'Cadastrada manualmente';
        if (v.referencia.trim() || v.trecho.trim()) r.evidencias.push({ fonteId: 'manual', fonteNome: 'Informado pelo usuário', tipo: 'documento', arquivo: v.referencia.trim() || 'Referência não informada', linha: '—', trecho: v.trecho.trim() || '—', versao: U.data(Date.now()) });
        R.recalcular(r); if (!r.evidencias.length) r.fonteClasse = v.classe;
        d.regras.push(r); return r.key;
      });
      ui.modal = null; render(); ui.toast('Regra cadastrada · pendente de validação');
      void key;
    },

    // tabela
    'tbl-flag': el => { const st = ui.tbl(el.dataset.scope); st.flag = st.flag === el.dataset.flag ? '' : el.dataset.flag; st.page = 1; render(); },
    'tbl-limpar': el => { const st = ui.tbl(el.dataset.scope); st.q = ''; st.flag = ''; Object.keys(st.f).forEach(k => { st.f[k] = ''; }); st.page = 1; render(); },
    'tbl-pagina': el => { ui.tbl(el.dataset.scope).page = +el.dataset.p; render(); document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' }); },
    'tbl-filtro': el => { const st = ui.tbl(el.dataset.scope); st.f[el.dataset.key] = el.value; st.page = 1; render(); },
    'tbl-agrupar': el => { ui.tbl(el.dataset.scope).group = el.value; render(); },
    'tbl-tamanho': el => { const st = ui.tbl(el.dataset.scope); st.size = +el.value; st.page = 1; render(); },
    'tbl-busca': el => { clearTimeout(debounce); debounce = setTimeout(() => { const st = ui.tbl(el.dataset.scope); st.q = el.value; st.page = 1; render(); }, 180); },
    'sel-toggle': el => { const s = ui.tbl(el.dataset.scope).sel; s.has(el.dataset.key) ? s.delete(el.dataset.key) : s.add(el.dataset.key); render(); },
    'sel-pagina': el => {
      const scope = el.dataset.scope, st = ui.tbl(scope);
      const f = R.ordenar(R.filtrar(ui.regrasDoEscopo(scope), st), st.group), pg = f.slice((st.page - 1) * st.size, st.page * st.size);
      const todos = pg.every(r => st.sel.has(r.key)); pg.forEach(r => (todos ? st.sel.delete(r.key) : st.sel.add(r.key))); render();
    },
    'sel-grupo': el => { const st = ui.tbl(el.dataset.scope), ks = grupoKeys(el), todos = ks.every(k => st.sel.has(k)); ks.forEach(k => (todos ? st.sel.delete(k) : st.sel.add(k))); render(); },
    'sel-todas-filtro': el => { const st = ui.tbl(el.dataset.scope); R.filtrar(ui.regrasDoEscopo(el.dataset.scope), st).forEach(r => st.sel.add(r.key)); render(); },
    'sel-limpar': el => { ui.tbl(el.dataset.scope).sel.clear(); render(); },

    // decisões
    aprovar: el => {
      const r = S.regra(el.dataset.key);
      if (R.temConflito(r)) { ui.toast('Resolva o conflito entre as fontes antes de aprovar', 'warn'); ui.drawer = { key: r.key }; render(); return; }
      S.commit(() => R.aprovar(r)); render(); ui.toast(`${r.id} aprovada`);
    },
    rejeitar: el => abrirModal({ tipo: 'rejeitar', keys: [el.dataset.key] }),
    devolver: el => { const r = S.regra(el.dataset.key); S.commit(() => R.devolver(r, 'Devolvida para revisão do especialista')); render(); ui.toast(`${r.id} devolvida para revisão`, 'info'); },
    'motivo-rapido': el => { const t = document.getElementById('m-mot'); t.value = el.dataset.motivo; t.focus(); },
    'confirmar-rejeicao': form => {
      const motivo = new FormData(form).get('motivo').trim(); if (!motivo) return;
      const keys = ui.modal.keys;
      S.commit(() => keys.forEach(k => { const r = S.regra(k); if (r) R.rejeitar(r, motivo); }));
      Object.values(ui.tabelas).forEach(st => keys.forEach(k => st.sel.delete(k)));
      ui.modal = null; render(); ui.toast(`${keys.length} regra(s) rejeitada(s)`);
    },
    'aprovar-selecionadas': el => { const st = ui.tbl(el.dataset.scope); aprovarKeys(keysDe(el.dataset.scope)); st.sel.clear(); render(); },
    'rejeitar-selecionadas': el => abrirModal({ tipo: 'rejeitar', keys: keysDe(el.dataset.scope) }),
    'devolver-selecionadas': el => {
      const keys = keysDe(el.dataset.scope);
      S.commit(() => keys.forEach(k => R.devolver(S.regra(k), 'Devolvida em lote para revisão')));
      ui.tbl(el.dataset.scope).sel.clear(); render(); ui.toast(`${keys.length} regra(s) devolvida(s) para revisão`, 'info');
    },
    'aprovar-grupo': el => { aprovarKeys(grupoKeys(el), `grupo "${decodeURIComponent(el.dataset.grupo)}"`); render(); },
    'aprovar-filtro': el => {
      const scope = el.dataset.scope, f = R.filtrar(ui.regrasDoEscopo(scope), ui.tbl(scope));
      const alvo = f.filter(r => r.status !== 'aprovada' && !R.temConflito(r)), conf = f.filter(R.temConflito).length, sem = alvo.filter(R.semEvidencia).length;
      abrirModal({ tipo: 'confirmar', icon: 'check', titulo: `Aprovar ${alvo.length} regra(s) do filtro?`, sub: 'Cada aprovação fica registrada no histórico da regra.', acao: 'aprovar-filtro-ok', dados: { scope }, classe: 'ok', botao: `Aprovar ${alvo.length} regra(s)`,
        corpo: `<div class="pk-sum"><div class="rowi">${DIF.icon('check', 16)}Serão aprovadas<b class="tnum">${alvo.length}</b></div>
          <div class="rowi" style="color:var(--red)">${DIF.icon('alert', 16)}Em conflito · ficam de fora<b class="tnum">${conf}</b></div>
          <div class="rowi" style="color:var(--warn)">${DIF.icon('file', 16)}Sem evidência · aprovadas e sinalizadas<b class="tnum">${sem}</b></div></div>` });
    },
    'aprovar-filtro-ok': el => {
      const scope = el.dataset.scope, f = R.filtrar(ui.regrasDoEscopo(scope), ui.tbl(scope));
      ui.modal = null; aprovarKeys(f.filter(r => r.status !== 'aprovada').map(r => r.key), 'filtro atual'); render();
    },

    // detalhe da regra
    'abrir-regra': el => { ui.drawer = { key: el.dataset.key, editando: false }; DIF.overlays.render(); },
    'fechar-drawer': () => { ui.drawer = null; DIF.overlays.render(); },
    'fechar-modal': () => fecharModal(),
    'editar-regra': () => { ui.drawer.editando = true; DIF.overlays.render(); document.getElementById('edit-enunciado')?.focus(); },
    'cancelar-edicao': () => { ui.drawer.editando = false; DIF.overlays.render(); },
    'salvar-edicao': el => {
      const r = S.regra(el.dataset.key), novo = document.getElementById('edit-enunciado').value.trim();
      if (novo && novo !== r.enunciado) S.commit(() => {
        const antes = r.enunciado; r.enunciado = novo; R.hist(r, 'Enunciado editado', `Antes: ${antes}`);
        if (r.status === 'aprovada') { r.status = 'pendente'; R.hist(r, 'Voltou para pendente após edição'); }
      });
      ui.drawer.editando = false; render(); ui.toast('Edição salva');
    },
    'resolver-conflito': el => {
      const r = S.regra(el.dataset.key), i = +el.dataset.idx, v = r.conflito.versoes[i];
      S.commit(() => { r.conflito.resolucao = i; r.conflito.divergencia = false; if (r.status === 'revisao') r.status = 'pendente'; R.hist(r, `Conflito resolvido: vale "${v.valor}"`, `Versão de ${v.fonteNome}`); R.recalcular(r); });
      render(); ui.toast('Conflito resolvido · a regra já pode ser aprovada');
    },
    divergencia: el => { const r = S.regra(el.dataset.key); S.commit(() => { r.conflito.divergencia = true; r.status = 'revisao'; R.hist(r, 'Registrada como divergência a investigar'); }); render(); ui.toast('Divergência registrada para investigação', 'info'); },
    'desfazer-resolucao': el => {
      const r = S.regra(el.dataset.key);
      S.commit(() => { r.conflito.resolucao = null; r.conflito.divergencia = false; if (r.status === 'aprovada') r.status = 'pendente'; R.hist(r, 'Resolução do conflito desfeita'); R.recalcular(r); });
      render();
    },

    // pacotes
    'gerar-pacotes': el => {
      const d = desc(el); abrirModal({ tipo: 'gerando', passo: 0 });
      const passo = i => {
        if (i < 4) { ui.modal.passo = i; DIF.overlays.render(); setTimeout(() => passo(i + 1), 650); return; }
        const v = S.commit(() => DIF.pacotes.gerar(d, d.regras.filter(r => r.status === 'aprovada')));
        ui.pacoteSel[d.id] = v.n; ui.modal = null; render();
        ui.toast(`Versão v${v.n} gerada · ${v.totais.fatos} fatos em ${v.totais.pacotes} pacote(s)`);
      };
      passo(0);
    },
    'ver-versao': el => { ui.pacoteSel[el.dataset.did] = +el.dataset.n; render(); },
    'ver-conteudo': el => abrirModal({ tipo: 'conteudo', did: el.dataset.did, n: el.dataset.n, pk: el.dataset.pk || null }),
    'baixar-pacote': el => {
      const d = desc(el), v = d.versoes.find(x => x.n === +el.dataset.n);
      U.download(`${el.dataset.pk || 'pacotes-' + U.slug(d.nome)}-v${v.n}.json`, JSON.stringify(DIF.pacotes.conteudo(d, v, el.dataset.pk), null, 2));
      ui.toast('Download iniciado');
    },
    'publicar-versao': el => abrirModal({ tipo: 'confirmar', icon: 'send', titulo: `Publicar a versão v${el.dataset.n}?`, sub: `Os pacotes ficam disponíveis para os agentes em domain-packs/${U.slug(desc(el).cluster)}.`,
      acao: 'publicar-versao-ok', dados: { did: el.dataset.did, n: el.dataset.n }, classe: 'dark', botao: 'Publicar' }),
    'publicar-versao-ok': el => {
      const v = desc(el).versoes.find(x => x.n === +el.dataset.n);
      S.commit(() => { v.status = 'publicado'; v.publicadoEm = Date.now(); }); ui.modal = null; render(); ui.toast(`Versão v${v.n} publicada`);
    },
  };
  return A;
})();

/* ============================================================================
   FUTURO ARQUIVO: js/app.js — renderização e inicialização
   ========================================================================== */
DIF.app = (() => {
  const $ = id => document.getElementById(id);
  let ultimaRota = '';

  function conteudo(r) {
    if (r.view !== 'etapa') return { html: DIF.views[r.view](), rodape: '' };
    const d = DIF.store.descoberta(r.id);
    if (!d) return { html: DIF.ui.empty({ icon: 'compass', titulo: 'Descoberta não encontrada', texto: 'Ela pode ter sido removida ao restaurar a demonstração.', acao: '<a class="btn primary" href="#/descobertas">Ver descobertas</a>' }), rodape: '' };
    DIF.ui.ultimaDescoberta = d.id;
    const mapa = { fontes: 'etapaFontes', levantamento: 'etapaLevantamento', validacao: 'etapaValidacao', pacotes: 'etapaPacotes' };
    return { html: DIF.views[mapa[r.etapa] || 'etapaFontes'](d), rodape: DIF.views.rodapeWizard(d, r.etapa) };
  }

  function renderView() {
    const r = DIF.ui.rota = DIF.router.parse();
    const chave = JSON.stringify(r);
    const ativo = document.activeElement, id = ativo && ativo.id, pos = ativo && ativo.selectionStart;
    const { html, rodape } = conteudo(r);
    $('view-wrap').innerHTML = `<div class="view ${chave === ultimaRota ? 'still' : ''}">${html}</div>${rodape}`;
    $('topbar').innerHTML = DIF.views.topbar(r);
    ultimaRota = chave;
    if (id) { const el = document.getElementById(id); if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* tipo sem seleção */ } } }
  }

  function render() {
    renderView();
    $('sidebar').innerHTML = DIF.views.sidebar(DIF.ui.rota);
    DIF.overlays.render();
  }

  function eventos() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      const fn = DIF.actions[el.dataset.action];
      if (!fn) return;
      if (el.tagName === 'A' || (el.tagName === 'BUTTON' && el.type !== 'submit')) e.preventDefault();
      e.stopPropagation();
      fn(el, e);
    });
    document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) DIF.actions[el.dataset.change](el, e); });
    document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el) DIF.actions[el.dataset.input](el, e); });
    document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); DIF.actions[f.dataset.submit](f, e); });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (DIF.ui.modal && DIF.ui.modal.tipo !== 'gerando') { DIF.ui.modal = null; DIF.overlays.render(); }
      else if (DIF.ui.drawer) { DIF.ui.drawer = null; DIF.overlays.render(); }
    });
    // arrastar arquivos para a área de upload
    ['dragover', 'dragleave', 'drop'].forEach(tipo => document.addEventListener(tipo, e => {
      const drop = e.target.closest && e.target.closest('#drop');
      if (!drop) return;
      e.preventDefault();
      drop.classList.toggle('over', tipo === 'dragover');
      if (tipo === 'drop') { const inp = document.getElementById('f-arq'); inp.files = e.dataTransfer.files; DIF.actions['arquivos-fonte'](inp); }
    }));
    window.addEventListener('hashchange', () => { DIF.ui.drawer = null; DIF.ui.modal = null; render(); $('main').scrollTop = 0; });
  }

  return {
    render, renderView,
    init() { DIF.store.load(); eventos(); render(); },
  };
})();

DIF.app.init();
</script>
</body>
</html>
