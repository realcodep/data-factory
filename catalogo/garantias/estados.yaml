estados:
  - id: garantias:garantia_imobiliaria.inexistente
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia ainda não existe (estado virtual de partida)
  - id: garantias:garantia_imobiliaria.ativa_sem_vinculo
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia incluída e ativa, sem contrato vigente
    sinonimos: [garantia ativa sem contrato, garantia incluída, garantia não associada, garantia livre]
    predicado:
      tabela: garantia
      chave: id
      filtros: {tipo: IMO, situacao: A}
      nao_existe: [{tabela: garantia_contrato, chave_local: id, chave_remota: id_garantia, filtros: {situacao: V}}]
  - id: garantias:garantia_imobiliaria.associada
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia ativa associada a contrato vigente
    sinonimos: [garantia associada, garantia vinculada, garantia associada a contrato ativo]
    predicado:
      tabela: garantia
      chave: id
      filtros: {tipo: IMO, situacao: A}
      existe:
        - {tabela: garantia_contrato, chave_local: id, chave_remota: id_garantia, filtros: {situacao: V},
           trazer: {id_contrato_vigente: id_contrato}}
  - id: garantias:garantia_imobiliaria.bloqueada
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia bloqueada (associada a contrato)
    sinonimos: [garantia bloqueada]
    propagacao_max_s: 6
    predicado:
      tabela: garantia
      chave: id
      filtros: {tipo: IMO, situacao: B}
      existe:
        - {tabela: garantia_contrato, chave_local: id, chave_remota: id_garantia, filtros: {situacao: V},
           trazer: {id_contrato_vigente: id_contrato}}
  - id: garantias:garantia_imobiliaria.desassociada
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia ativa que já teve vínculo encerrado e não tem contrato vigente
    sinonimos: [garantia desassociada, garantia desvinculada]
    predicado:
      tabela: garantia
      chave: id
      filtros: {tipo: IMO, situacao: A}
      existe: [{tabela: garantia_contrato, chave_local: id, chave_remota: id_garantia, filtros: {situacao: D}}]
      nao_existe: [{tabela: garantia_contrato, chave_local: id, chave_remota: id_garantia, filtros: {situacao: V}}]
  - id: garantias:garantia_imobiliaria.excluida
    entidade: garantias:garantia_imobiliaria
    descricao: Garantia excluída
    sinonimos: [garantia excluída, garantia removida]
    predicado: {tabela: garantia, chave: id, filtros: {tipo: IMO, situacao: E}}
