[project]
name = "fabrica-massa"
version = "0.1.0"
description = "Fábrica de Massa de Testes — Cluster Garantias (ambiente demo fictício)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "sqlalchemy>=2.0", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29",
  "httpx>=0.27", "mcp>=1.2", "playwright>=1.44",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
massa = "massa.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["massa*", "demo*"]
